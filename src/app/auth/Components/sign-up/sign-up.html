<!-- register.component.html -->

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">
    
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="row g-4 align-items-start">

          <!-- Left Form -->
          <div class="col-lg-9">

            <div class="row g-4">

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  First Name <span class="text-danger">*</span>
                </label>

                <input type="text" class="form-control custom-input" formControlName="firstName">

                <small class="text-danger" *ngIf="submitted && f['firstName'].errors">
                  First name is required
                </small>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Last Name <span class="text-danger">*</span>
                </label>

                <input type="text" class="form-control custom-input" formControlName="lastName">

                <small class="text-danger" *ngIf="submitted && f['lastName'].errors">
                  Last name is required
                </small>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Display Name <span class="text-danger">*</span>
                </label>

                <input type="text" class="form-control custom-input" formControlName="displayName">

                <small class="text-danger" *ngIf="submitted && f['displayName'].errors">
                  Display name is required
                </small>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Job Title <span class="text-danger">*</span>
                </label>

                <input type="text" class="form-control custom-input" formControlName="jobTitle">

                <small class="text-danger" *ngIf="submitted && f['jobTitle'].errors">
                  Job title is required
                </small>
              </div>

            </div>
          </div>

          <!-- Image Upload -->
          <div class="col-lg-3">
            <div class="upload-box text-center">

              <input type="file" hidden #fileInput (change)="onFileSelected($event)">

              <div (click)="fileInput.click()" class="cursor-pointer">

                <div *ngIf="!previewImage">
                  <h6 class="mb-3">Select Image</h6>

                  <i class="bi bi-image fs-1 text-secondary"></i>
                </div>

                <img *ngIf="previewImage" [src]="previewImage" class="img-fluid rounded-3 preview-img">
              </div>

            </div>
          </div>

        </div>

        <!-- Email & Mobile -->
        <div class="row g-4 mb-4">

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Email Address <span class="text-danger">*</span>
            </label>

            <input type="email" class="form-control custom-input" formControlName="email">

            <small class="text-danger" *ngIf="submitted && f['email'].errors">
              Valid email is required
            </small>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Mobile No. <span class="text-danger">*</span>
            </label>

            <input type="text" class="form-control custom-input" formControlName="mobile">

            <small class="text-danger" *ngIf="submitted && f['mobile'].errors">
              Mobile number is required
            </small>
          </div>

        </div>

        <!-- Password -->
        <div class="row g-4 mb-4">

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Password <span class="text-danger">*</span>
            </label>

            <div class="position-relative">

              <input [type]="showPassword ? 'text' : 'password'" class="form-control custom-input pe-5"
                formControlName="password">

              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="showPassword = !showPassword">
              </i>

            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Confirm Password <span class="text-danger">*</span>
            </label>

            <div class="position-relative">

              <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control custom-input pe-5"
                formControlName="confirmPassword">

              <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
                (click)="showConfirmPassword = !showConfirmPassword">
              </i>

            </div>
          </div>

        </div>

        <!-- Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" formControlName="terms">

          <label class="form-check-label">
            I agree to the
            <a href="#" class="text-decoration-none">Terms of Service</a>
            and
            <a href="#" class="text-decoration-none">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-semibold">
          Create account
        </button>

      </form>

    </div>
  </div>
</div>
