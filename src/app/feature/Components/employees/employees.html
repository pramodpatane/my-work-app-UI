<div class="card" *ngIf="IsDefaultView">

  <div class="card-header d-flex justify-content-between align-items-center bg-secondary">

    <span class="fw-bold text-white">
      {{ gridConfiguration.gridTitle }}
    </span>

    <div class="d-flex align-items-center gap-2">

      <input type="text" class="form-control form-control-sm" style="width: 220px;" placeholder="Search employees..."
        (input)="onSearch($event)" />

      <button type="button" class="btn btn-sm btn-primary" (click)="OpenForm()">
        <i class="bi bi-plus-lg me-1"></i>
        Add
      </button>

    </div>
  </div>

  <app-common-ag-grid [gridConfiguration]="gridConfiguration" [recordCount]="totalCount" (gridEvent)="onGridEvent($event)">
  </app-common-ag-grid>
</div>

<div class="card" *ngIf="!IsDefaultView">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="fw-bold">{{HeaderText}}</span>
    <button type="button" class="btn btn-sm btn-primary" (click)="toggleIsDefaultView()">X</button>
  </div>
  <div class="card-body">


    <form [formGroup]="employeeForm">

      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="mb-3">
            <label>First Name</label>
            <input type="text" class="form-control" formControlName="firstName" />
            <small class="text-danger" *ngIf="form['firstName'].touched && form['firstName'].invalid">
              First Name is required
            </small>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="mb-3">
            <label>Last Name</label>
            <input type="text" class="form-control" formControlName="lastName" />
            <small class="text-danger" *ngIf="form['lastName'].touched && form['lastName'].invalid">
              Last Name is required
            </small>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" formControlName="email" />
            <small class="text-danger" *ngIf="form['email'].touched && form['email'].invalid">
              Valid Email is required
            </small>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="mb-3">
            <label>Salary</label>
            <input type="number" class="form-control" formControlName="salary" />
            <small class="text-danger" *ngIf="form['salary'].touched && form['salary'].invalid">
              Salary must be greater than 0
            </small>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="mb-3">
            <label>Department</label>
            <select class="form-control" formControlName="departmentId">
              <option value="0" disabled selected>Select Department</option>
              <option *ngFor="let department of DepartmentsList" [value]="department.dataValue">
                {{ department.dataText}}
              </option>
            </select>
            <small class="text-danger" *ngIf="form['departmentId'].touched && form['departmentId'].invalid">
              Department is required
            </small>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-6">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" formControlName="isActive" />
            <label class="form-check-label">Is Active</label>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" formControlName="isDeleted" />
            <label class="form-check-label">Is Deleted</label>
          </div>
        </div>
      </div>

      <div class="" *ngIf="ButtonText == 'Insert'">
        <button class="btn btn-primary" (click)="Insert()">{{ButtonText}}</button>
      </div>

      <div class="" *ngIf="ButtonText == 'Update'">
        <button class="btn btn-primary" (click)="Update()">{{ButtonText}}</button>
      </div>
    </form>
  </div>
</div>
