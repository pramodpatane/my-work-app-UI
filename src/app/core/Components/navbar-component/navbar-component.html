<!-- Mobile Overlay -->
<div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 z-3" *ngIf="isMobileMenuOpen"
  (click)="closeMobileMenu()">
</div>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar bg-dark text-white position-fixed top-0 start-0 h-100 z-3" [class.collapsed]="isCollapsed"
  [class.mobile-open]="isMobileMenuOpen">

  <!-- Logo -->
  <div class="d-flex align-items-center border-bottom border-secondary px-3" style="height: 68px;">

    <div class="bg-primary rounded-3 d-flex align-items-center justify-content-center flex-shrink-0"
      style="width: 40px; height: 40px;">

      <i class="bi bi-grid-1x2-fill"></i>

    </div>

    <span class="fw-semibold fs-5 ms-3 text-nowrap" *ngIf="!isCollapsed">

      Admin Panel

    </span>

    <!-- Mobile Close -->
    <button type="button" class="btn btn-link text-white ms-auto d-lg-none" (click)="closeMobileMenu()">

      <i class="bi bi-x-lg"></i>

    </button>

  </div>


  <!-- Menu -->
  <div class="overflow-auto p-2">

    <ul class="list-unstyled mb-0">

      <li *ngFor="let menu of appMenus" class="mb-1">

        <a *ngIf="!menu.children || menu.children.length === 0" [routerLink]="menu.link" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="menu-link d-flex align-items-center text-decoration-none rounded-3 px-3" (click)="closeMobileMenu()">

          <i [class]="menu.icon" class="flex-shrink-0">
          </i>

          <span class="ms-3 text-nowrap" *ngIf="!isCollapsed">

            {{ menu.title }}

          </span>

        </a>


        <!-- ================= PARENT MENU ================= -->

        <div *ngIf="menu.children && menu.children.length > 0">

          <div class="menu-link d-flex align-items-center justify-content-between rounded-3 px-3"
            [class.active-parent]="menu.expanded" (click)="toggleMenu(menu)">

            <div class="d-flex align-items-center">

              <i [class]="menu.icon" class="flex-shrink-0">
              </i>

              <span class="ms-3 text-nowrap" *ngIf="!isCollapsed">

                {{ menu.title }}

              </span>

            </div>

            <i *ngIf="!isCollapsed" class="bi" [ngClass]="
                menu.expanded
                  ? 'bi-chevron-down'
                  : 'bi-chevron-right'
              ">
            </i>

          </div>


          <!-- Submenu -->

          <ul *ngIf="menu.expanded && !isCollapsed" class="list-unstyled ps-4 mt-1">

            <li *ngFor="let child of menu.children" class="mb-1">

              <a [routerLink]="child.link" routerLinkActive="active-submenu"
                class="submenu-link d-flex align-items-center text-decoration-none rounded-2 px-3"
                (click)="closeMobileMenu()">

                <i [class]="child.icon"></i>

                <span class="ms-3">
                  {{ child.title }}
                </span>

              </a>

            </li>

          </ul>

        </div>

      </li>

    </ul>

  </div>

</aside>


<!-- ================= MAIN AREA ================= -->

<div class="main-content" [class.sidebar-collapsed]="isCollapsed">


  <!-- ================= TOPBAR ================= -->

  <header
    class="bg-white border-bottom shadow-sm sticky-top d-flex align-items-center justify-content-between px-3 px-md-4"
    style="height: 68px;">

    <!-- Left -->
    <div>

      <!-- Mobile -->
      <button type="button" class="btn btn-light d-lg-none" (click)="toggleMobileMenu()">

        <i class="bi bi-list fs-5"></i>

      </button>


      <!-- Desktop -->
      <button type="button" class="btn btn-light d-none d-lg-inline-flex" (click)="toggleSidebar()">

        <i class="bi bi-list fs-5"></i>

      </button>

    </div>


    <!-- Right -->

    <div class="d-flex align-items-center gap-2">

      <!-- Notification -->

      <button type="button" class="btn btn-light rounded-circle position-relative d-none d-sm-flex"
        style="width: 40px; height: 40px;">

        <i class="bi bi-bell"></i>

        <span
          class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-white rounded-circle">
        </span>

      </button>


      <!-- User -->

      <div class="dropdown">

        <button type="button" class="btn d-flex align-items-center gap-2" data-bs-toggle="dropdown"
          aria-expanded="false">

          <div
            class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center"
            style="width: 40px; height: 40px;">

            <i class="bi bi-person-fill fs-5"></i>

          </div>


          <div class="text-start d-none d-md-block">

            <div class="fw-semibold small">
              {{ userName }}
            </div>

            <div class="text-muted small">
              {{ userRole }}
            </div>

          </div>

          <i class="bi bi-chevron-down small d-none d-md-block"></i>

        </button>


        <!-- Dropdown -->

        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2" style="min-width: 230px;">

          <!-- User header -->

          <li>

            <div class="d-flex align-items-center gap-2 p-2">

              <div
                class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center"
                style="width: 42px; height: 42px;">

                <i class="bi bi-person-fill fs-5"></i>

              </div>

              <div>

                <div class="fw-semibold">
                  {{ userName }}
                </div>

                <div class="text-muted small">
                  {{ userRole }}
                </div>

              </div>

            </div>

          </li>

          <li>
            <hr class="dropdown-divider">
          </li>


          <!-- Users -->

          <li *ngIf="userRole === 'Superadmin'">

            <a class="dropdown-item rounded-2" routerLink="/core/users">

              <i class="bi bi-people me-2"></i>

              Users

            </a>

          </li>


          <!-- Settings -->

          <li>

            <a class="dropdown-item rounded-2" routerLink="/user-settings">

              <i class="bi bi-gear me-2"></i>

              User Settings

            </a>

          </li>


          <li>
            <hr class="dropdown-divider">
          </li>


          <!-- Logout -->

          <li>

            <button type="button" class="dropdown-item rounded-2 text-danger" (click)="logout()">

              <i class="bi bi-box-arrow-right me-2"></i>

              Logout

            </button>

          </li>

        </ul>

      </div>

    </div>

  </header>


  <!-- ================= CONTENT ================= -->

  <main class="p-3 p-md-4">

    <router-outlet></router-outlet>

  </main>

</div>
