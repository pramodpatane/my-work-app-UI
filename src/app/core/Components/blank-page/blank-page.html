<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg border-0 text-center p-5" style="max-width: 550px; width: 100%;">
    
    <div class="mb-4">
      <i class="bi bi-shield-lock-fill text-danger" style="font-size: 5rem;"></i>
    </div>

    <h2 class="fw-bold mb-3">Access Denied</h2>

    <p class="text-muted mb-4">
      You don't have permission to access any modules in this application.
      Please contact your system administrator if you believe this is incorrect.
    </p>

    <div class="d-grid gap-2">
      <button class="btn btn-primary" (click)="goToLogin()">
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Back to Login
      </button>

      <button class="btn btn-outline-secondary" (click)="refreshPage()">
        <i class="bi bi-arrow-clockwise me-2"></i>
        Refresh
      </button>
    </div>

    <hr>

    <small class="text-muted">
      Error Code: <strong>403 - Forbidden</strong>
    </small>

  </div>
</div>
